<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Digital Identity - Pre-Quiz</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body data-quiz-kind="pre">

  <header class="top-progress">
    <div class="container">
      <nav class="stepper" data-stepper aria-label="Experience progress"></nav>
    </div>
  </header>

  <main class="quiz-page">
    <div class="container quiz-wrap" data-quiz>

      <div class="pill">PRE-EXPERIENCE QUIZ</div>
      <h1 class="quiz-title">Think You Know Privacy?</h1>
      <p class="quiz-sub">
        8 questions. No hints. Can you get a perfect score before the experience changes how you see the web?
      </p>

      <!-- progress -->
      <div class="quiz-progress">
        <div class="quiz-progress-left" data-qcount>Question 1 of 8</div>
        <div class="quiz-progress-right" data-qpercent>0% complete</div>
      </div>
      <div class="quiz-progress-bar" aria-hidden="true">
        <div class="quiz-progress-fill" data-qfill style="width:0%"></div>
      </div>

      <!-- Question card — unchanged from original -->
      <section class="quiz-card quiz-card--light" data-card>
        <div class="quiz-kicker" data-qkicker>Question 1 of 8</div>
        <h2 class="quiz-question" data-qtitle></h2>
        <div class="quiz-options" data-options></div>
      </section>

      <!-- Floating feedback panel — pops out to the right, not part of flow -->
      <div class="quiz-float-panel" data-feedback hidden>
        <div class="quiz-float-inner">
          <div class="quiz-feedback-title" data-feedback-title></div>
          <div class="quiz-feedback-text" data-feedback-text></div>
          <button class="quiz-next-button" data-next-button>
            <span style="font-size:11px; opacity:0.7; letter-spacing:-0.02em;">&gt;&gt;</span>
            Next Question
          </button>
        </div>
      </div>

    </div>
  </main>

  <script src="./assets/app.js"></script>
  <script>
    if (window.GT && typeof GT.renderStepper === "function") GT.renderStepper("pre");
    if (window.GT && typeof GT.initQuizV2 === "function") GT.initQuizV2({ kind: "pre" });
  </script>
</body>
</html>
