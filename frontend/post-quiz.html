<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GhostTrace — Post Quiz</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="container">
    <div class="stepper" data-stepper></div>

    <div class="card glow-teal quizBox" data-quiz>
      <div class="qTop">
        <div data-q-index>Question 1 of 8</div>
        <div><span data-q-progress>13% complete</span></div>
      </div>

      <div class="progressBar" data-qbar><div></div></div>

      <div class="qTitle" data-q-title></div>
      <div class="stack" data-q-options></div>

      <div class="footerNav">
        <button class="btn ghost" data-prev>← Previous</button>
        <!-- <button class="btn primary" data-next>Next →</button> -->
        <button class="btn primary" data-submit style="display:none" disabled>
          Submit Quiz →
        </button>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    GT.renderStepper("post");
    GT.initQuiz("post");
  </script>
</body>
</html>
