<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GhostTrace — Browse 2 Intro</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="container center">
    <div class="stack" style="width:min(820px,100%);">
      <div class="stepper" data-stepper></div>

      <div class="card glow-purple" style="padding:22px;text-align:center;">
        <div class="badge">Round 2</div>
        <div class="h1" style="font-size:34px;margin:12px 0 8px;">Browse Mindfully</div>
        <p class="sub" style="max-width:680px;">
          Now that you’ve seen what gets tracked, try to minimize your exposure.
          Use these strategies while browsing.
        </p>

        <div class="stack" style="max-width:680px;margin:14px auto 0;text-align:left;">
          <div class="card">
            <div class="cardTitle">Strategies</div>
            <div class="stack">
              <div class="option selected" style="cursor:default;"><span class="radio"></span><div class="optionText"><b>Skim quickly</b> — don’t linger</div></div>
              <div class="option selected" style="cursor:default;"><span class="radio"></span><div class="optionText"><b>Be intentional with clicks</b></div></div>
              <div class="option selected" style="cursor:default;"><span class="radio"></span><div class="optionText"><b>Limit scroll depth</b></div></div>
              <div class="option selected" style="cursor:default;"><span class="radio"></span><div class="optionText"><b>Spend less time overall</b></div></div>
            </div>
          </div>

          <div class="mission-cta">
            <a href="browse2.html" class="btn-primary">
              Start Mindful Browsing <span aria-hidden="true">→</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./assets/app.js"></script>
<script>
  if (window.GT && typeof GT.renderStepper === "function") {
    GT.renderStepper("b2");
  }

  document.querySelector("[data-begin-browse]")?.addEventListener("click", () => {
    window.location.href = "browse2.html";
  });
</script>
</body>
</html>
